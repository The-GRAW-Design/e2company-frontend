name: Deploy no GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Um deploy por vez; não cancela um deploy em andamento.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Configura o GitHub Pages
        uses: actions/configure-pages@v5

      - name: Instala dependências
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build estático
        run: npm run build
        env:
          # Site de projeto: https://<org>.github.io/<repositório>/
          NEXT_PUBLIC_BASE_PATH: /${{ github.event.repository.name }}

      - name: Envia o artefato
        uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publica
        id: deployment
        uses: actions/deploy-pages@v4
